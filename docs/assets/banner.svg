<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">onbehalf</title>
  <desc id="desc">The setup is shared. The identity is not. One AI harness setup for the team. The runtime of each user acts as that user. onbehalf works with an AI harness, a model gateway and the work tools of the team. The external systems record each action as the user.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#7c6cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c6cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0.85" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: Inter, -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <rect width="1280" height="360" fill="url(#glow-a)"/>
    <rect width="1280" height="360" fill="url(#glow-b)"/>
  </g>

  <!-- Mark: one user, one key -->
  <g transform="translate(80 80)">
    <rect width="60" height="60" rx="16" fill="url(#mark)"/>
    <circle cx="30" cy="23" r="9" fill="#0b1022"/>
    <path d="M13 48c1.8-9 8.6-14 17-14s15.2 5 17 14" fill="#0b1022"/>
    <circle cx="47" cy="47" r="9" fill="#0b1022"/>
    <path d="M42.8 47.2l2.8 2.8 5-5.4" fill="none" stroke="#2dd4bf" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="160" y="129" class="sans" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1.5">onbehalf</text>

  <text x="80" y="202" class="sans" font-size="30" font-weight="600" fill="#ffffff" letter-spacing="-0.4">The setup is shared.
    <tspan fill="#9fe8dc">The identity is not.</tspan></text>
  <text x="80" y="238" class="sans" font-size="18" fill="#a5adcb">One AI harness setup for the team. Each runtime acts as its user.</text>

  <!-- Chips -->
  <g class="sans" font-size="14" font-weight="500" fill="#d6dbf5">
    <g transform="translate(80 270)">
      <rect width="108" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="54" y="21" text-anchor="middle">AI harness</text>
    </g>
    <g transform="translate(198 270)">
      <rect width="132" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="66" y="21" text-anchor="middle">Model gateway</text>
    </g>
    <g transform="translate(340 270)">
      <rect width="116" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="58" y="21" text-anchor="middle">Work tools</text>
    </g>
    <g transform="translate(466 270)">
      <rect width="132" height="32" rx="16" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="66" y="21" text-anchor="middle">Shared stack</text>
    </g>
  </g>

  <!-- Attribution feed -->
  <g transform="translate(760 52)">
    <rect width="440" height="256" rx="14" fill="#0a0f1f" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="22" cy="22" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="22" r="5" fill="#febc2e"/>
    <circle cx="58" cy="22" r="5" fill="#28c840"/>
    <text x="420" y="27" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#7d86a8" letter-spacing="1.2">ONE HOST · EACH ACTION AS ITS USER</text>
    <path d="M0 44H440" stroke="#ffffff" stroke-opacity="0.08"/>

    <g transform="translate(0 56)">
      <circle cx="34" cy="20" r="14" fill="#2dd4bf" fill-opacity="0.18" stroke="#2dd4bf"/>
      <text x="34" y="25" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#2dd4bf">A</text>
      <text x="60" y="15" class="sans" font-size="14" font-weight="600" fill="#ffffff">alice<tspan dx="8" fill="#7d86a8" font-weight="400">·  runtime</tspan></text>
      <text x="60" y="35" class="mono" font-size="13" fill="#c3c9e6">git push origin fix/token-refresh</text>
    </g>
    <g transform="translate(0 106)">
      <circle cx="34" cy="20" r="14" fill="#fb923c" fill-opacity="0.18" stroke="#fb923c"/>
      <text x="34" y="25" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#fb923c">B</text>
      <text x="60" y="15" class="sans" font-size="14" font-weight="600" fill="#ffffff">bob<tspan dx="8" fill="#7d86a8" font-weight="400">·  runtime</tspan></text>
      <text x="60" y="35" class="mono" font-size="13" fill="#c3c9e6">az deployment group create …</text>
    </g>
    <g transform="translate(0 156)">
      <circle cx="34" cy="20" r="14" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa"/>
      <text x="34" y="25" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#a78bfa">C</text>
      <text x="60" y="15" class="sans" font-size="14" font-weight="600" fill="#ffffff">carol<tspan dx="8" fill="#7d86a8" font-weight="400">·  runtime</tspan></text>
      <text x="60" y="35" class="mono" font-size="13" fill="#c3c9e6">gh pr create --fill</text>
    </g>
    <g transform="translate(0 206)">
      <circle cx="34" cy="20" r="14" fill="#2dd4bf" fill-opacity="0.18" stroke="#2dd4bf"/>
      <text x="34" y="25" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#2dd4bf">A</text>
      <text x="60" y="15" class="sans" font-size="14" font-weight="600" fill="#ffffff">alice<tspan dx="8" fill="#7d86a8" font-weight="400">·  model gateway</tspan></text>
      <text x="60" y="35" class="mono" font-size="13" fill="#c3c9e6">2,140 tokens on a personal gateway key</text>
    </g>
  </g>
</svg>
