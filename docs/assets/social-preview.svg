<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">onbehalf</title>
  <desc id="desc">Social preview card. The setup is shared. The identity is not. One AI harness setup for the team. The runtime of each user acts as that user, with its own Unix account, logins and gateway key.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/>
      <stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.1" cy="0.08" r="0.65">
      <stop offset="0" stop-color="#7c6cf6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c6cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <style>
    .sans { font-family: Inter, "Noto Sans", -apple-system, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "JetBrains Mono", "DejaVu Sans Mono", monospace; }
  </style>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow-a)"/>
  <rect width="1280" height="640" fill="url(#glow-b)"/>

  <!-- Mark: one user, one key -->
  <g transform="translate(80 84)">
    <rect width="64" height="64" rx="17" fill="url(#mark)"/>
    <circle cx="32" cy="24.5" r="9.6" fill="#0b1022"/>
    <path d="M13.9 51.2c1.9-9.6 9.2-14.9 18.1-14.9s16.2 5.3 18.1 14.9" fill="#0b1022"/>
    <circle cx="50.1" cy="50.1" r="9.6" fill="#0b1022"/>
    <path d="M45.7 50.3l3 3 5.3-5.8" fill="none" stroke="#2dd4bf" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="166" y="134" class="sans" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-1.5">onbehalf</text>

  <text x="80" y="262" class="sans" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-1.4">The setup is shared.</text>
  <text x="80" y="328" class="sans" font-size="54" font-weight="700" fill="#9fe8dc" letter-spacing="-1.4">The identity is not.</text>

  <text class="sans" font-size="23" fill="#a5adcb">
    <tspan x="80" y="392">One AI harness setup for the full team.</tspan>
    <tspan x="80" y="424">Each runtime runs as its user: own Unix</tspan>
    <tspan x="80" y="456">account, own logins, own gateway key.</tspan>
  </text>

  <!-- Chips -->
  <g class="sans" font-size="16" font-weight="500" fill="#d6dbf5">
    <g transform="translate(80 500)">
      <rect width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="85" y="25" text-anchor="middle">No shared account</text>
    </g>
    <g transform="translate(262 500)">
      <rect width="168" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="84" y="25" text-anchor="middle">Shared stack in Git</text>
    </g>
    <g transform="translate(442 500)">
      <rect width="130" height="38" rx="19" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="65" y="25" text-anchor="middle">Open source</text>
    </g>
  </g>

  <text x="80" y="584" class="mono" font-size="18" fill="#7d86a8">github.com/Neverdecel/onbehalf</text>

  <!-- Attribution feed -->
  <g transform="translate(740 176)">
    <rect width="460" height="300" rx="16" fill="#0a0f1f" fill-opacity="0.78" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="24" cy="24" r="5.5" fill="#ff5f57"/>
    <circle cx="44" cy="24" r="5.5" fill="#febc2e"/>
    <circle cx="64" cy="24" r="5.5" fill="#28c840"/>
    <text x="438" y="29" text-anchor="end" class="sans" font-size="12" font-weight="600" fill="#7d86a8" letter-spacing="1.2">ONE HOST · EACH ACTION AS ITS USER</text>
    <path d="M0 48H460" stroke="#ffffff" stroke-opacity="0.08"/>

    <g transform="translate(0 64)">
      <circle cx="36" cy="22" r="15" fill="#2dd4bf" fill-opacity="0.18" stroke="#2dd4bf"/>
      <text x="36" y="27" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#2dd4bf">A</text>
      <text x="64" y="16" class="sans" font-size="15" font-weight="600" fill="#ffffff">alice<tspan dx="8" fill="#7d86a8" font-weight="400">·  runtime</tspan></text>
      <text x="64" y="38" class="mono" font-size="14" fill="#c3c9e6">git push origin fix/token-refresh</text>
    </g>
    <g transform="translate(0 122)">
      <circle cx="36" cy="22" r="15" fill="#fb923c" fill-opacity="0.18" stroke="#fb923c"/>
      <text x="36" y="27" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#fb923c">B</text>
      <text x="64" y="16" class="sans" font-size="15" font-weight="600" fill="#ffffff">bob<tspan dx="8" fill="#7d86a8" font-weight="400">·  runtime</tspan></text>
      <text x="64" y="38" class="mono" font-size="14" fill="#c3c9e6">az deployment group create …</text>
    </g>
    <g transform="translate(0 180)">
      <circle cx="36" cy="22" r="15" fill="#a78bfa" fill-opacity="0.18" stroke="#a78bfa"/>
      <text x="36" y="27" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#a78bfa">C</text>
      <text x="64" y="16" class="sans" font-size="15" font-weight="600" fill="#ffffff">carol<tspan dx="8" fill="#7d86a8" font-weight="400">·  runtime</tspan></text>
      <text x="64" y="38" class="mono" font-size="14" fill="#c3c9e6">gh pr create --fill</text>
    </g>
    <g transform="translate(0 238)">
      <circle cx="36" cy="22" r="15" fill="#2dd4bf" fill-opacity="0.18" stroke="#2dd4bf"/>
      <text x="36" y="27" text-anchor="middle" class="sans" font-size="14" font-weight="700" fill="#2dd4bf">A</text>
      <text x="64" y="16" class="sans" font-size="15" font-weight="600" fill="#ffffff">alice<tspan dx="8" fill="#7d86a8" font-weight="400">·  model gateway</tspan></text>
      <text x="64" y="38" class="mono" font-size="14" fill="#c3c9e6">2,140 tokens on a personal gateway key</text>
    </g>
  </g>
</svg>
