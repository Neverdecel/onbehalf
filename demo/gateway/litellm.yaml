# Demo gateway: the model names of examples/stack, served by the fake model.
# No request goes to a real model provider.
model_list:
  - model_name: gpt-5.4
    litellm_params:
      model: openai/agent-model
      api_base: http://fake-model:8080/v1
      api_key: os.environ/PROVIDER_API_KEY
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: openai/agent-model
      api_base: http://fake-model:8080/v1
      api_key: os.environ/PROVIDER_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
