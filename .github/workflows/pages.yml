name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - web/**
      - docs/assets/banner.svg
      - docs/assets/architecture.svg
      - docs/assets/social-preview.png
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - site/**
      - web/**
      - docs/assets/banner.svg
      - docs/assets/architecture.svg
      - docs/assets/social-preview.png
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# One deployment at a time. Do not cancel a deployment that runs.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy the images from docs/assets
        run: make site-assets
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./site
          destination: ./_site
      # The start page is a Vite app in web/. It goes over the index.html of
      # Jekyll; the blog, the about page and the feed stay from Jekyll.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the start page
        run: |
          npm ci --prefix web
          npm run lint --prefix web
          npm run build --prefix web
          sudo cp -R web/dist/. _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write # the deployment proves its origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
