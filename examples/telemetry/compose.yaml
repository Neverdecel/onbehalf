# Telemetry backend: the OTel Collector and Langfuse, on the host of
# onbehalf. See README.md for the steps. Run it as root in
# /etc/onbehalf-telemetry:
#
#   cp .env.example .env && chmod 600 .env   # then fill in the values
#   docker compose up -d
#
# The services listen only on 127.0.0.1. Users must not be in the docker
# group: that gives root access.
name: onbehalf-telemetry

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://langfuse:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/langfuse
  SALT: ${SALT:?set in .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in .env}
  # Do not send usage data of this Langfuse to the Langfuse company.
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?set in .env}

services:
  # The Collector of onbehalf. `onbehalf telemetry on` writes its
  # configuration and the telemetry keys in /etc/onbehalf/telemetry. The
  # host network lets the runtimes send to 127.0.0.1:4318, and lets
  # onbehalf send SIGHUP to the process otelcol-contrib after a user change.
  collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    restart: unless-stopped
    command: ["--config=/etc/onbehalf/telemetry/otelcol.yaml"]
    # The group otelcol-contrib of the host can read the configuration.
    user: "10001:${OTELCOL_GID:?set in .env}"
    network_mode: host
    volumes:
      - /etc/onbehalf/telemetry:/etc/onbehalf/telemetry:ro
    depends_on:
      langfuse-web:
        condition: service_healthy

  langfuse-web:
    image: langfuse/langfuse:4.56.0@sha256:b1948c7c0931f277975b985e30e73536b1bca5822705ddd9a89ba7c1ed79b3ee
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in .env}
      # The first organization, project, API keys and account. Langfuse makes
      # them at the first start. The Collector uses the API keys.
      LANGFUSE_INIT_ORG_ID: onbehalf
      LANGFUSE_INIT_ORG_NAME: onbehalf
      LANGFUSE_INIT_PROJECT_ID: onbehalf
      LANGFUSE_INIT_PROJECT_NAME: onbehalf
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:?set in .env}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_ADMIN_NAME:-ops}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?set in .env}
      AUTH_DISABLE_SIGNUP: "true"
    # Only this host can reach Langfuse. Open it with an SSH tunnel.
    ports:
      - 127.0.0.1:3000:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname -i):3000/api/public/health || exit 1"]
      interval: 5s
      retries: 60
    depends_on: &langfuse-depends
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  langfuse-worker:
    image: langfuse/langfuse-worker:4.58.0@sha256:5f0e9e0da70b0c5d91ad9158941ca042c25c936d371524a1454226ebc5f12093
    restart: unless-stopped
    environment: *langfuse-env
    depends_on: *langfuse-depends

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.17.8@sha256:387ebbcca253026def04dc79e83d2323ac7d97bf309ddd090a8a3c702573e01a
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set in .env}
    volumes:
      - clickhouse:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      retries: 30

  # Object storage for the events of Langfuse. The command makes the bucket.
  minio:
    image: cgr.dev/chainguard/minio:latest@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    command: ["--requirepass", "${REDIS_AUTH:?set in .env}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_AUTH:?set in .env}

volumes:
  postgres:
  clickhouse:
  clickhouse-logs:
  minio:
  redis:
