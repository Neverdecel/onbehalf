# Example nginx site for the onbehalf broker. See README.md.
# oauth2-proxy does the single sign-on. nginx sends the login to the broker.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name board.example.com;
    ssl_certificate     /etc/ssl/board.example.com.crt;
    ssl_certificate_key /etc/ssl/board.example.com.key;

    # The sign-in pages of oauth2-proxy.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # nginx asks oauth2-proxy for the login of each request.
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Uri $request_uri;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;

        # This line replaces a login header from the client. Do not remove it.
        auth_request_set $login $upstream_http_x_auth_request_preferred_username;
        proxy_set_header X-Auth-Request-Preferred-Username $login;
        proxy_set_header Authorization "";

        proxy_pass http://unix:/run/onbehalf-broker/broker.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The event stream of OpenCode stays open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
