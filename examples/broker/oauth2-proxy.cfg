# Example oauth2-proxy configuration for Entra ID. See README.md.
# Put the client secret and the cookie secret in the environment file of
# the service (OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET), not here.

provider = "oidc"
oidc_issuer_url = "https://login.microsoftonline.com/TENANT-ID/v2.0"
client_id = "CLIENT-ID"
scope = "openid profile email"
redirect_url = "https://board.example.com/oauth2/callback"

http_address = "127.0.0.1:4180"
reverse_proxy = true
upstreams = ["static://202"]

# Sends X-Auth-Request-Preferred-Username to nginx. For Entra ID, this is
# the UPN of the login.
set_xauthrequest = true
email_domains = ["*"]
skip_provider_button = true

cookie_secure = true
cookie_samesite = "lax"
