# Gateway models. Users see the model_name values; the stack's
# opencode.json must use the same names. Replace every <...> value.
model_list:
  # An OpenAI model deployed in Azure AI Foundry (OpenAI API).
  - model_name: gpt-5.4
    litellm_params:
      model: azure/<deployment name>
      api_base: https://<resource>.openai.azure.com/
      api_version: "<API version from the Foundry portal>"
      api_key: os.environ/AZURE_API_KEY

  # A Claude model deployed in Azure AI Foundry (Anthropic API).
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: azure_ai/claude-sonnet-4-5
      api_base: https://<resource>.services.ai.azure.com/anthropic
      api_key: os.environ/AZURE_AI_API_KEY

  # Other providers use the same form, for example:
  # - model_name: claude-opus
  #   litellm_params:
  #     model: anthropic/<model id>
  #     api_key: os.environ/ANTHROPIC_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
